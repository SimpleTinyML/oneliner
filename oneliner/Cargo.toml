[package]
name = "OneLiner"
version = "0.1.0"
edition = "2021"
description = "One-line Rust model binding macro with pluggable backends"

[lib]
name = "OneLiner"

[features]
default = ["iree-runtime"]
std = ["oneliner-runtime/std"]
alloc = ["oneliner-runtime/alloc"]
iree-runtime = ["oneliner-runtime/iree-runtime"]
ariel-os = ["oneliner-runtime/ariel-os"]
ndarray = ["oneliner-runtime/ndarray"]


[dependencies]
oneliner-macro = { path = "../oneliner-macro" }
oneliner-runtime = { path = "../oneliner-runtime", default-features = false }
