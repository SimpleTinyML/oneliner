[package]
name = "OneLiner"
version = "0.1.0"
edition = "2021"
description = "One-line Rust model binding macro with pluggable backends"

[lib]
name = "OneLiner"

[features]
default = ["std", "iree-runtime"]
std = ["alloc"]
alloc = []
iree-runtime = []

[dependencies]
oneliner-macro = { path = "../oneliner-macro" }
defmt = { version = "1.0.0" }
log = { version = "0.4.26"}
aligned ={ version = "0.4.3" }