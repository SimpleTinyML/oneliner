[package]
name = "oneliner-macro"
version = "0.1.0"
edition = "2021"
description = "Attribute macro implementation for OneLiner"

[lib]
name = "oneliner_macro"
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "1", features = ["full"] }
walkdir = "2"
