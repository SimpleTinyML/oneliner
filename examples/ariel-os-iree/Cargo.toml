[package]
name = "oneliner-ariel-os-iree"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
ariel-os = { path = "build/imports/ariel-os/src/ariel-os", features = [] }
ariel-os-boards = { path = "build/imports/ariel-os/src/ariel-os-boards" }
OneLiner = { path = "../../oneliner", default-features = false, features = ["iree-runtime"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(context, values(any()))"] }

