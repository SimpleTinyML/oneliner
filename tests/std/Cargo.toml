[package]
name = "oneliner-std-e2e-tests"
version = "0.0.0"
edition = "2024"
publish = false
# `[[test]]` entries below are the complete target list for this package.
# Without `autotests = false`, a new tests/*.rs file would be discovered as a
# heavy model target that bypasses the `required-features` gate.
autotests = false

[features]
default = []
host-e2e = []

[[test]]
name = "abs2_mlir"
path = "tests/abs2_mlir.rs"
required-features = ["host-e2e"]

[[test]]
name = "lenet5_onnx"
path = "tests/lenet5_onnx.rs"
required-features = ["host-e2e"]

[[test]]
name = "lenet5_pytorch"
path = "tests/lenet5_pytorch.rs"
required-features = ["host-e2e"]

[[test]]
name = "lenet5_tensorflow"
path = "tests/lenet5_tensorflow.rs"
required-features = ["host-e2e"]

[[test]]
name = "mcunet_tflite"
path = "tests/mcunet_tflite.rs"
required-features = ["host-e2e"]

[dependencies]
oneliner = {
    path = "../../oneliner",
}
oneliner-profiler = { path = "../../oneliner-profiler" }
